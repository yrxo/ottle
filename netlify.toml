[build]
  publish = "public"
  functions = "netlify/functions"
  command = "mkdir -p public && cp index.html public/index.html"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ottle-api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
